[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "courtvision"
version = "0.1.0"
description = "Basketball video analytics: tracking, teams, pose-based possession, passes, tactical view, speed"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "ultralytics>=8.1",
    "opencv-python>=4.8",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "pyyaml>=6.0",
    "lap>=0.5.12",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
courtvision = "courtvision.cli:main"

[tool.setuptools.packages.find]
include = ["courtvision*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
